; 实验室用例表：段名 [case:<实验室标识>:<用例标识>]，同实验室默认值放 [lab:<实验室标识>]
; 键：scene（默认段必填，用例可覆盖）、params（属性路径 → 值）、steps（单个数组值，顺序稳定）、expect、timeout
; 步骤每项的 kind：call（target/method/args）、set（path/value）、wait（frames）
; 路径一律以 . 分隔，根是用例场景实例；资源路径会自动复制成副本，不写回 .tres

[lab:face]
scene = "res://resource/default/assets/Character/charactercard/character_container.tscn"
timeout = 5.0

[case:face:hit_normal]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [20, 0, 0.5]}, {"kind": "wait", "frames": 6}]

[case:face:hit_light]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [2, 0, 0.9]}, {"kind": "wait", "frames": 4}]

[case:face:hit_mirrored]
steps = [{"kind": "call", "method": "set_mirrored", "args": [true]}, {"kind": "call", "method": "play_damage_animation", "args": [20, 0, 0.5]}, {"kind": "wait", "frames": 4}]

[case:face:magic_hit]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [0, 10, 1.0]}, {"kind": "wait", "frames": 3}]

[case:face:hit_down]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [20, 0, 0.0]}, {"kind": "wait", "frames": 20}]

[case:face:down_then_heal]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [20, 0, 0.0]}, {"kind": "wait", "frames": 5}, {"kind": "call", "method": "play_damage_animation", "args": [-5, 0, 0.6]}, {"kind": "wait", "frames": 40}]

[case:face:stop_mid_animation]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [20, 0, 0.5]}, {"kind": "wait", "frames": 2}, {"kind": "call", "method": "stop_damage_animation"}, {"kind": "wait", "frames": 2}]

[case:face:double_trigger]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [8, 0, 0.7]}, {"kind": "call", "method": "play_damage_animation", "args": [16, 0, 0.5]}, {"kind": "wait", "frames": 6}]

[case:face:boundary_zero_damage]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [0, 0, 1.0]}, {"kind": "wait", "frames": 2}]

[case:face:boundary_huge_damage]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [1000000, 1000000, 0.001]}, {"kind": "wait", "frames": 5}]

[case:face:boundary_ratio_over_one]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [20, 0, 1.5]}, {"kind": "wait", "frames": 3}]

[case:face:boundary_ratio_negative]
steps = [{"kind": "call", "method": "play_damage_animation", "args": [20, 0, -0.5]}, {"kind": "wait", "frames": 5}]

[case:face:boundary_negative_pack]
params = {"profile.hit_pack.knockback_percent": -1000, "profile.hit_pack.knee_bend_percent": -1000, "profile.hit_pack.lean_back_percent": -1000, "profile.hit_pack.knee_force_percent": -100, "profile.hit_pack.upright_force_percent": -100, "profile.hit_pack.recover_speed_percent": -50}
steps = [{"kind": "call", "method": "play_damage_animation", "args": [20, 0, 0.5]}, {"kind": "wait", "frames": 4}]
expect = {"profile.hit_pack.knockback_percent": -1000, "profile.hit_pack.recover_speed_percent": -50}

[case:face:boundary_huge_pack]
params = {"profile.hit_pack.knockback_percent": 100000, "profile.hit_pack.knee_bend_percent": 100000, "profile.hit_pack.lean_back_percent": 100000, "profile.hit_pack.knee_force_percent": 400, "profile.hit_pack.upright_force_percent": 400, "profile.hit_pack.recover_speed_percent": 1}
steps = [{"kind": "call", "method": "play_damage_animation", "args": [20, 0, 0.2]}, {"kind": "wait", "frames": 10}]
expect = {"profile.hit_pack.knockback_percent": 100000}
