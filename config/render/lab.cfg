; 实验室用例表：段名 [case:<实验室标识>:<用例标识>]，同实验室默认值放 [lab:<实验室标识>]
; 键：scene（默认段必填）、params（属性路径 → 值）、preset（操作参数预设名）、wait（施加预设后等待帧数）、expect、timeout
; 预设即操作参数数据体的一个资源文件；预设名 → 路径见文件末的 [preset:<实验室标识>] 段

[lab:characterface]
scene = "res://resource/default/assets/Character/charactercard/character_container.tscn"
timeout = 5.0

[case:characterface:boundary_huge_damage]
preset = "boundary_huge"
wait = 5

[case:characterface:boundary_ratio_negative]
preset = "ratio_negative"
wait = 5

[case:characterface:boundary_ratio_over_one]
preset = "ratio_over_one"
wait = 3

[case:characterface:boundary_zero_damage]
preset = "boundary_zero"
wait = 2

[case:characterface:hit_down]
preset = "hit_down"
wait = 20

[case:characterface:hit_light]
preset = "hit_light"
wait = 4

[case:characterface:hit_normal]
preset = "hit_normal"
wait = 6

[case:characterface:magic_hit]
preset = "magic_hit"
wait = 3

; 操作参数预设：预设名 → 资源路径；换实验室内核后用例只写预设名
[preset:characterface]
hit_normal = "res://resource/default/assets/Character/charactercard/preset/hit_normal.tres"
hit_light = "res://resource/default/assets/Character/charactercard/preset/hit_light.tres"
hit_down = "res://resource/default/assets/Character/charactercard/preset/hit_down.tres"
magic_hit = "res://resource/default/assets/Character/charactercard/preset/magic_hit.tres"
boundary_huge = "res://resource/default/assets/Character/charactercard/preset/boundary_huge.tres"
boundary_zero = "res://resource/default/assets/Character/charactercard/preset/boundary_zero.tres"
ratio_negative = "res://resource/default/assets/Character/charactercard/preset/ratio_negative.tres"
