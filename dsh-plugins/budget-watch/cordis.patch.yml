# nfm-budget-watch bundle 层。
#
# 由 profile 的 dsh.profile.bundles 引用（plugin_manager install_bundle 时自动追加）。
# 用户可在 profile 自己的 cordis.patch.yml 中覆盖本层的 config。

- insert:
    - id: budget-watch
      name: 'nfm-budget-watch'
      config:
        enabled: true
        thresholds: [0.8]
        remindUnregistered: false
